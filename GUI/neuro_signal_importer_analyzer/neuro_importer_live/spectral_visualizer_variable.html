<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Variable Neural Spectral Monitor</title>
<style>body{background:#020404;color:#0ff;font-family:monospace}input,button{background:#000;color:#0ff;border:1px solid #0ff;padding:6px}table{border-collapse:collapse}td,th{border:1px solid #066;padding:4px 8px}</style></head>
<body><h2>Variable Neural Spectral Monitor</h2><input id="url" value="ws://127.0.0.1:8766" size="32"><button onclick="connect()">Connect</button> <span id="status">disconnected</span><h3 id="summary"></h3><table><thead><tr><th>Index</th><th>Name</th><th>Centroid Hz</th><th>Alpha</th><th>Entropy</th></tr></thead><tbody id="rows"></tbody></table>
<script>let ws;function connect(){if(ws)ws.close();ws=new WebSocket(document.getElementById('url').value);ws.onopen=()=>status.textContent='connected';ws.onclose=()=>status.textContent='closed';ws.onmessage=e=>update(JSON.parse(e.data));}function update(d){summary.textContent=`channels=${d.n_channels} mean centroid=${d.summary?.mean_centroid_hz?.toFixed(2)}Hz namespace=${d.channel_manifest?.channel_namespace}`;rows.innerHTML=(d.metrics_by_channel||[]).slice(0,128).map(r=>`<tr><td>${r.index}</td><td>${r.name}</td><td>${r.centroid_hz.toFixed(2)}</td><td>${r.alpha_power.toExponential(2)}</td><td>${r.entropy.toFixed(2)}</td></tr>`).join('');}</script></body></html>
